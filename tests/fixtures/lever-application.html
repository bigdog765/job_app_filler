<!doctype html>
<!-- Reduced, script-free field markup from the public Lever application supplied
     on 2026-10-30. No applicant values, session tokens, or submission endpoint. -->
<html><head><title>Example company - Software Engineer</title></head><body>
<form id="application-form" enctype="multipart/form-data" method="POST">
  <div class="section page-centered application-form">
    <h4>Submit your application</h4>
    <ul>
      <li class="application-question resume"><label>
        <div class="application-label">Resume/CV <span class="required">✱</span></div>
        <div class="application-field"><input type="file" name="resume"></div>
      </label></li>
      <li class="application-question"><label>
        <div class="application-label">Full name<span class="required">✱</span></div>
        <div class="application-field"><input type="text" data-qa="name-input" name="name" required></div>
      </label></li>
      <li class="application-question"><label>
        <div class="application-label">Email<span class="required">✱</span></div>
        <div class="application-field"><input type="email" data-qa="email-input" name="email" required></div>
      </label></li>
      <li class="application-question"><label>
        <div class="application-label">Phone <span class="required">✱</span></div>
        <div class="application-field"><input type="text" data-qa="phone-input" name="phone" required></div>
      </label></li>
      <li class="application-question" data-qa="structured-contact-location-question"><label>
        <div class="application-label">Current location </div>
        <div class="application-field">
          <input class="location-input" data-qa="location-input" id="location-input" type="text" name="location">
          <input id="selected-location" type="hidden" name="selectedLocation">
          <div class="dropdown-container"><div class="dropdown-no-results">No location found. Try entering a different location</div><div class="dropdown-loading-results">Loading</div></div>
        </div>
      </label></li>
      <li class="application-question"><label>
        <div class="application-label">Current company <span class="required">✱</span></div>
        <div class="application-field"><input type="text" data-qa="org-input" name="org" required></div>
      </label></li>
      <li class="application-question"><label>
        <div class="application-label">LinkedIn URL</div>
        <div class="application-field"><input type="text" name="urls[LinkedIn]"></div>
      </label></li>
      <li class="application-question"><label>
        <div class="application-label">GitHub URL</div>
        <div class="application-field"><input type="text" name="urls[GitHub]"></div>
      </label></li>
      <li class="application-question"><label>
        <div class="application-label">Portfolio URL</div>
        <div class="application-field"><input type="text" name="urls[Portfolio]"></div>
      </label></li>
    </ul>
  </div>
</form>
</body></html>
