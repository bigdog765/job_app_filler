<!-- Reduced from Affirm's Greenhouse form after the phone widget initializes. -->
<div class="application--container">
  <div class="text-input-wrapper">
    <div class="input-wrapper">
      <label for="first_name">First Name*</label>
      <input id="first_name" type="text" value="">
    </div>
  </div>
  <fieldset class="phone-input">
    <div class="phone-input__phone">
      <div class="text-input-wrapper">
        <div class="input-wrapper">
          <label id="phone-label" for="phone">Phone*</label>
          <div class="iti iti--allow-dropdown iti--show-flags iti--inline-dropdown">
            <div class="iti__country-container">
              <div class="iti__dropdown-content iti__hide" role="dialog">
                <div class="iti__search-input-wrapper">
                  <input id="iti-0__search-input" type="search" class="iti__search-input"
                    placeholder="Search" role="combobox" aria-label="Search" autocomplete="off">
                </div>
              </div>
            </div>
            <input id="phone" class="input input__single-line" type="tel" maxlength="255">
          </div>
        </div>
      </div>
    </div>
  </fieldset>
</div>
